stages:
  - build
  - build-image
  - test
  - release

variables:
  DOCKER_HOST: "tcp://server-custom-dind.custom-dind:2375"
  # Move cargo data into the project directory so it can be cached by the runner
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

build-image:
  stage: build
  image: docker:27-cli
  script:
    - export COMMIT_SHA=$(git rev-parse --short HEAD)
    - echo "COMMIT_SHA=$COMMIT_SHA" >> build.env
    - echo "Building Rust + Docker image"
    - docker build -t       ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} .
    # Ensure the image can run offline
    - docker run --rm --net none ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} tpdg --help
    # Ensure the image can compile offline
    - docker run --rm --net none ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} cargo --offline build --all --all-features --release
    - docker run --rm --net none ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} cargo --offline build --all --all-features
    # Push the image to the registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker push           ${CI_REGISTRY_IMAGE}:${COMMIT_SHA}
    - docker tag ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} ${CI_REGISTRY_IMAGE}:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  tags:
    - dind-amd

test-image:
  stage: test
  # Variable comes from artifacts->VARIABLE_NAME
  image: ${CI_REGISTRY_IMAGE}:${COMMIT_SHA}
  variables:
    DOCKER_RUN_FLAGS: "--net none"
    DOCKER_OPTIONS: "--net none"
  # https://gitlab.com/gitlab-org/gitlab-runner/-/work_items/903#:~:text=by%20Koen%20Lekkerkerker-,Problem,%F0%9F%91%8D%2022%20%F0%9F%91%8E%200
  needs:
    - job: build-image
      artifacts: true
  script:
    - uname -a
    - tpdg --help
  tags:
    - dind-amd

push-image:
  stage: test
  image: docker:27-cli
  needs:
    - test-image
    - job: build-image
      artifacts: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker pull ${CI_REGISTRY_IMAGE}:${COMMIT_SHA}
    - docker tag ${CI_REGISTRY_IMAGE}:${COMMIT_SHA} ${CI_REGISTRY_IMAGE}:latest
    #    - docker push $CI_REGISTRY_IMAGE:${COMMIT_SHA} - No need, already pushed
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master
    - main
  tags:
    - dind-amd

default:
  # Use the commit reference slug (branch/tag name) as the cache key
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    #    paths:
    #      # Cache the cargo home directory which contains registries and bins
    #      - .cargo
    #      # Cache the build artifacts directory
    #      - target
    #    # This ensures the cache is available to all jobs in the pipeline
    policy: pull-push

ci:
  before_script:
    - rustc --version
    - cargo --version
    - rustup component add rustfmt
    - rustup component add clippy
    - apt update && apt install -y sccache python3-pip
    - pip3 install --break-system-packages strictdoc
  image: rust:1.92-bookworm
  stage: build
  script:
    - cargo fmt -- --check
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo build --release
    - cargo install cargo2junit --version 0.1.15 --locked --root /usr/local
    - |
      set +e
      RUSTC_BOOTSTRAP=1 cargo test --release -- -Z unstable-options --format json --report-time > test-output.json
      test_status=$?
      set -e
      mkdir -p test-results
      cargo2junit < test-output.json > test-results/junit.xml
      exit $test_status
    - strictdoc export requirements/ --output-dir /tmp/strictdoc-validate-output --no-parallelization
  artifacts:
    when: always
    paths:
      - target/release/tpdg
    reports:
      junit: test-results/junit.xml
    expire_in: 1 day
  coverage: '/(\d+\.\d+)% coverage/'
  allow_failure: false

# ---------------------------------------------------------------------------
# Binary release (TPDG-8)
#
# Tags matching v* build tpdg for Linux amd64 (native) and Linux arm64
# (cross-built with cargo-zigbuild against glibc 2.17). Archives go to the
# generic package registry and are linked from a GitLab Release together with
# a SHA256SUMS file.
#
# The arm64 job only exists when the RELEASE_ARM64 CI/CD variable is "true".
# ---------------------------------------------------------------------------
release:build:
  stage: release
  image: rust:1.92-bookworm
  needs:
    - job: ci
      artifacts: false
    - job: test-image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
  before_script:
    - rustc --version
    - cargo --version
    - apt-get update -qq
    - apt-get install -y -qq zip
  script:
    - cargo build --release --locked --bin tpdg
    - |
      stage="tpdg-${CI_COMMIT_TAG}-linux-amd64"
      rm -rf "$stage"; mkdir -p "$stage" dist
      cp target/release/tpdg "$stage/"
      cp README.md "$stage/"
      if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi
      (cd "$stage" && zip -r "../dist/${stage}.zip" .)
  artifacts:
    paths:
      - dist/*.zip
    expire_in: never
  tags:
    - dind-amd

release:build-arm64:
  stage: release
  image: rust:1.92-bookworm
  needs:
    - job: ci
      artifacts: false
    - job: test-image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/ && $RELEASE_ARM64 == "true"'
  before_script:
    - rustc --version
    - cargo --version
    - apt-get update -qq
    - apt-get install -y -qq zip python3-pip
    # zig is the cross-linker that cargo-zigbuild uses to target glibc 2.17
    - pip3 install --break-system-packages ziglang
    - rustup target add aarch64-unknown-linux-gnu
    - cargo install --locked cargo-zigbuild
  script:
    - cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu.2.17 --bin tpdg
    - |
      stage="tpdg-${CI_COMMIT_TAG}-linux-arm64"
      rm -rf "$stage"; mkdir -p "$stage" dist
      cp target/aarch64-unknown-linux-gnu/release/tpdg "$stage/"
      cp README.md "$stage/"
      if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi
      (cd "$stage" && zip -r "../dist/${stage}.zip" .)
  artifacts:
    paths:
      - dist/*.zip
    expire_in: never
  allow_failure: true
  tags:
    - dind-amd

release:publish:
  stage: release
  image: rust:1.92-bookworm
  needs:
    - job: release:build
      artifacts: true
    - job: release:build-arm64
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.+/'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq jq
  script:
    - cd dist
    - sha256sum *.zip > SHA256SUMS
    - cat SHA256SUMS
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/tpdg/${CI_COMMIT_TAG}"
    - |
      for f in *.zip SHA256SUMS; do
        echo "Uploading $f -> ${PACKAGE_URL}/$f"
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PACKAGE_URL}/$f"
      done
    - |
      links=$(for f in *.zip SHA256SUMS; do jq -n --arg n "$f" --arg u "${PACKAGE_URL}/$f" '{name: $n, url: $u, link_type: "package"}'; done | jq -s .)
      jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$links" '{tag_name: $tag, name: ("tpdg " + $tag), description: ("Binary release of tpdg " + $tag + "."), assets: {links: $links}}' > release.json
      curl --fail --silent --show-error --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  tags:
    - dind-amd
