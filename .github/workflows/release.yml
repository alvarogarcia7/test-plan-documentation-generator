name: Release

# Binary release (mirrors the GitLab release:build / release:publish jobs in .gitlab-ci.yml).
#  - Only runs for tags starting with "v" (e.g. v1.0.0, v0.1.0-rc.3_2026-11-02)
#  - Tags containing "-rc" are published as GitHub pre-releases
#  - One zip per architecture: tpdg-<tag>-<label>.zip
#  - Each architecture is built natively on its own runner (no cross-compilation)

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macos-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin tpdg --target "${{ matrix.target }}"

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          stage="tpdg-${TAG}-${LABEL}"
          rm -rf "$stage"; mkdir -p "$stage" dist
          cp "target/${TARGET}/release/tpdg" "$stage/"
          cp README.md "$stage/"
          (cd "$stage" && zip -r "../dist/${stage}.zip" .)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check archives
        run: |
          ls -la dist/
          count=$(ls dist/*.zip | wc -l | tr -d ' ')
          if [ "$count" -ne 4 ]; then
            echo "Expected 4 archives, found $count"
            exit 1
          fi

      - name: Create or update release
        run: |
          prerelease=""
          case "$TAG" in *-rc*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --verify-tag \
              --title "Release $TAG" \
              --notes "Binary release of tpdg for $TAG (linux amd64, linux arm64, macos arm64, macos amd64)." \
              $prerelease
          fi
