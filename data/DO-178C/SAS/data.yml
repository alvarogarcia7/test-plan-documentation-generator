system_overview: |
  The Flight Management System (FMS) is an integrated avionics system providing automated 
  flight control, navigation, and performance management for commercial aircraft. The system 
  interfaces with GPS, IRS, air data sensors, and flight control systems to optimize flight operations.

software_overview: |
  The FMS software consists of navigation management, guidance control, performance calculation, 
  database management, and display interface components. The software implements spatial and 
  temporal partitioning to isolate Level A critical functions from lower-level components.

software_level: "A"

