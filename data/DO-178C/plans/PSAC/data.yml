additional_considerations:
  previously_developed_software: |
    The FMS reuses navigation algorithms from a previously certified system (Level B). 
    This software will be reverified to Level A standards with additional structural 
    coverage analysis and robustness testing.
  tool_qualification: |
    The following development tools require qualification per DO-330:
    - Compiler: Qualified as TQL-5 (verification tool)
    - Static analyzer: Qualified as TQL-5 (verification tool)
    - Requirements management tool: Does not require qualification (no credit taken)
  alternative_methods: |
    Formal methods will be applied to the navigation state machine to demonstrate 
    correctness per DO-333 supplement. This will satisfy certain verification objectives 
    with analysis rather than testing.

supplier_oversight:
  suppliers:
    - name: "Database Provider Inc."
      role: "Navigation database development and updates"
      oversight_activities: "Quarterly audits of database quality processes and delivery verification"
    - name: "Hardware Systems Corp."
      role: "Flight Management Computer hardware"
      oversight_activities: "Software/hardware integration testing and interface verification"
