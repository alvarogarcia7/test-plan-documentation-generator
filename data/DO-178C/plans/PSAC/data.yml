        - "Requirements traceability to system requirements"
    - name: "Software Design Review"
      date: "2024-06-30"
      deliverables:
        - "Software Design Description (SDD)"
        - "Low-level requirements traceability"
    - name: "Code Complete"
      date: "2024-09-30"
      deliverables:
        - "Source code baseline"
        - "Unit test results"
    - name: "Software Integration Complete"
      date: "2024-11-15"
      deliverables:
        - "Integration test results"
        - "Software/hardware integration results"
    - name: "Software Verification Complete"
      date: "2025-01-30"
