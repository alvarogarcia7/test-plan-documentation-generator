# ----------------------------------------------------------------------------
# ACCEPTANCE CRITERIA (Required, Array)
# ----------------------------------------------------------------------------
# Overall criteria for accepting this Common Criteria evaluation.
acceptance_criteria:
  
  # Security Functional Requirements
  - "All SFRs implemented correctly and completely in the TOE"
  - "All SFRs covered by functional tests with passing results"
  - "Cryptographic implementations validated against FIPS 140-3 standards"
  - "Authentication mechanisms enforce mutual TLS 1.3 with certificate validation"
  
  # Security Assurance Requirements (EAL5)
  - "Security architecture description complete and consistent"
  - "Semiformal functional specification provided for all TSFI"
  - "Complete source code provided with traceability to design"
  - "TSF internals demonstrate well-structured, layered architecture"
  - "Test coverage analysis shows 100% TSFI and SFR coverage"
  - "Testing demonstrates correct operation of moderately complex mechanisms"
  - "Advanced vulnerability analysis performed with no exploitable vulnerabilities"
  
  # Testing and Coverage
  - "Functional coverage >= 95%"
  - "Interface coverage = 100%"
  - "SFR coverage = 100%"
  - "All security mechanisms tested under normal and abnormal conditions"
  
  # Vulnerability Assessment
  - "Penetration testing performed with high attack potential"
  - "All identified vulnerabilities mitigated or demonstrated as non-exploitable"
  - "Covert channel analysis shows no exploitable channels"
  - "Side channel analysis (power, EM, timing) shows no key leakage"
  
  # Documentation
  - "All required evaluation evidence documents delivered and complete"
  - "Evidence traceability maintained throughout evaluation"
  - "User guidance provides sufficient information for secure operation"
  
  # Certification
  - "Independent evaluation team confirms TOE meets all EAL5 requirements"
  - "No critical or high-severity findings remain unresolved"
  - "TOE awarded Common Criteria EAL5 certification"

# ============================================================================
# COMMON CRITERIA REFERENCE
# ============================================================================
#
# Common Criteria for Information Technology Security Evaluation (CC)
# - ISO/IEC 15408 - International standard for security certification
# - Three parts: Introduction and General Model, Security Functional Requirements,
#   Security Assurance Requirements
#
# EVALUATION ASSURANCE LEVELS (EAL):
# EAL1: Functionally Tested - Basic assurance
# EAL2: Structurally Tested - Low to moderate assurance
# EAL3: Methodically Tested and Checked - Moderate assurance
# EAL4: Methodically Designed, Tested, and Reviewed - Moderate to high assurance
# EAL5: Semiformally Designed and Tested - High assurance
# EAL6: Semiformally Verified Design and Tested - Very high assurance
# EAL7: Formally Verified Design and Tested - Extremely high assurance
#
# KEY CONCEPTS:
# - TOE: Target of Evaluation (the product being certified)
# - PP: Protection Profile (reusable security requirements)
# - ST: Security Target (TOE-specific security claims)
# - SFR: Security Functional Requirements (what security functions TOE provides)
# - SAR: Security Assurance Requirements (how TOE is developed and evaluated)
# - TSF: TOE Security Functions (implementation of SFRs)
# - TSFI: TSF Interfaces (external interfaces to security functions)
#
# AEROSPACE APPLICATION:
# Common Criteria certification is increasingly required for aerospace systems
# handling sensitive data, particularly:
# - Cockpit communications security
# - Flight data protection
# - Air traffic control data links
# - Avionics network security
# - Satellite communication security
#
# Often combined with DO-178C for comprehensive safety and security assurance.
#
# ============================================================================
